<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Emerald Teal Padel Gradient -->
    <linearGradient id="racketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Ball Lime Gradient -->
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="50%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="url(#racketGrad)" stroke-width="8" opacity="0.45" />

  <!-- Outer Neon Glow -->
  <circle cx="215" cy="215" r="130" fill="#10b981" opacity="0.18" filter="url(#glow)" />

  <!-- Padel Racket Handle -->
  <path d="M 285 305 L 385 405 C 396 416 396 432 385 443 C 374 454 358 454 347 443 L 247 343 Z" fill="#0f766e" stroke="#34d399" stroke-width="6" stroke-linejoin="round" />
  <!-- Handle Grip Lines -->
  <line x1="285" y1="355" x2="315" y2="385" stroke="#34d399" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  <line x1="315" y1="385" x2="345" y2="415" stroke="#34d399" stroke-width="5" stroke-linecap="round" opacity="0.8" />

  <!-- Padel Racket Frame (Tilted 45 degrees) -->
  <ellipse cx="215" cy="215" rx="120" ry="140" transform="rotate(-45 215 215)" fill="#022c22" stroke="url(#racketGrad)" stroke-width="18" filter="url(#glow)" />

  <!-- Padel Racket Face Core -->
  <ellipse cx="215" cy="215" rx="98" ry="118" transform="rotate(-45 215 215)" fill="#064e3b" opacity="0.85" />

  <!-- Padel Holes Pattern -->
  <g fill="#020617" stroke="#34d399" stroke-width="2.5" opacity="0.95">
    <circle cx="215" cy="215" r="9" />
    <circle cx="185" cy="185" r="8" />
    <circle cx="245" cy="245" r="8" />
    <circle cx="245" cy="185" r="8" />
    <circle cx="185" cy="245" r="8" />
    <circle cx="155" cy="155" r="7" />
    <circle cx="275" cy="275" r="7" />
    <circle cx="275" cy="155" r="7" />
    <circle cx="155" cy="275" r="7" />
    <circle cx="215" cy="150" r="7" />
    <circle cx="215" cy="280" r="7" />
    <circle cx="150" cy="215" r="7" />
    <circle cx="280" cy="215" r="7" />
  </g>

  <!-- High-Energy Optic-Lime Padel Ball -->
  <g filter="url(#glow)">
    <circle cx="365" cy="145" r="54" fill="url(#ballGrad)" stroke="#facc15" stroke-width="4.5" />
    <!-- Ball Seams -->
    <path d="M 330 118 Q 365 145 338 185" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" opacity="0.9" />
    <path d="M 402 108 Q 370 145 398 180" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Dynamic Sparkles -->
  <circle cx="435" cy="95" r="6" fill="#34d399" opacity="0.9" />
  <circle cx="458" cy="130" r="4.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="315" cy="78" r="5.5" fill="#facc15" opacity="0.85" />
</svg>
